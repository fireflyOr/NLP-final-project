[project]
name = "multabench-sae"
version = "1.0.0"
description = "NLP 097215 final project: SAE concept pruning, reweighting and text stacking on top of Joint TAR (MulTaBench)"
requires-python = "==3.10.*"
# Direct dependencies, pinned to the versions the reported experiments ran with (cluster environment, Oct 2026).
dependencies = [
    "torch==2.8.0",
    "transformers==5.20.2",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "huggingface_hub==2.2.0",
    "tokenizers==0.23.3",
    "safetensors==0.8.0",
    "lightgbm==4.7.0",
    "catboost==1.2.8",
    "scikit-learn==1.7.2",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "skrub==0.10.1",
    "autogluon.core==1.6.3",
    "kagglehub==1.0.2",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
# The experiments ran on Linux GPU nodes with CUDA 12.x drivers.
environments = ["sys_platform == 'linux'"]
# Pin every transitive dependency to the exact version that ran as well.
constraint-dependencies = [
    "annotated-doc==0.0.5", "anyio==4.15.1", "autogluon.common==1.6.3", "autogluon.features==1.6.3",
    "boto3==1.43.115", "botocore==1.43.115", "certifi==2026.10.19", "charset-normalizer==3.5.2", "click==8.5.0",
    "cloudpickle==3.1.2", "contourpy==1.3.2", "cycler==0.12.1", "exceptiongroup==1.3.1", "filelock==3.32.3",
    "fonttools==4.65.0", "fsspec==2026.7.0", "graphviz==0.21", "h11==0.16.0", "hf-xet==1.7.0", "httpcore2==2.14.0",
    "httpx2==2.14.0", "idna==3.20", "iniconfig==2.3.1", "Jinja2==3.1.6", "jmespath==1.1.0", "joblib==1.6.0",
    "kagglesdk==0.1.28", "kiwisolver==1.5.1", "markdown-it-py==4.2.0", "MarkupSafe==3.0.3", "matplotlib==3.10.9",
    "mdurl==0.1.2", "mpmath==1.3.0", "narwhals==2.27.1", "networkx==3.4.2", "packaging==26.3", "pillow==12.3.0",
    "plotly==7.1.0", "pluggy==1.7.0", "protobuf==7.36.2", "psutil==7.2.2", "pyarrow==24.0.0", "pydot==4.0.1",
    "Pygments==2.21.0", "pyparsing==3.3.3", "python-dateutil==2.9.0.post0", "pytz==2026.5", "PyYAML==6.0.3",
    "regex==2026.9.29", "requests==2.34.2", "rich==15.0.0", "s3transfer==0.19.3", "shellingham==1.5.4",
    "six==1.17.0", "sympy==1.14.0", "threadpoolctl==3.7.0", "tomli==2.5.0", "tqdm==4.70.1", "triton==3.4.0",
    "truststore==0.10.5", "typer==0.27.3", "typing_extensions==4.16.0", "tzdata==2026.5", "urllib3==2.8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
